<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1650c8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HBC Jičín">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-64.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>HBC Jičín – statistiky</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: věcný trenérský nástroj – rychlý zápis, čitelná čísla, nic navíc.
   IDEA: zápis o utkání + tabule skóre; hřiště jako pracovní plocha.
   PICTURE: polovina hřiště s brankou (zadávání i heatmapa), grafy sezóny.
   COLOUR and TYPE: kobaltová palubovka, oranžová 6m zóna/míč, bílé čáry; Barlow Condensed pro čísla, Barlow pro text.
   LAYOUT: modrý pás s týmem a filtry, pod ním obsah do 1240px; na mobilu spodní lišta. */
:root{color-scheme:light dark;
--bg:light-dark(#f3f5fa,#0a0f1d);--card:light-dark(#fff,#121a2c);--ink:light-dark(#0d1424,#edf1fa);--mut:light-dark(#566075,#9aa4bb);
--line:light-dark(#dde3ee,#243050);--chip:light-dark(#eaf0fc,#1a2440);--blue:light-dark(#1650c8,#6f9bff);--or:light-dark(#d9530b,#ff8f45);
--band:light-dark(#1650c8,#0f2a66);--bandInk:#fff;--court:light-dark(#dfe8fb,#15213d);--area:light-dark(#f5b98d,#7a3c12);--cl:light-dark(#fff,#c9d6f5);
--win:light-dark(#137a3a,#4ade80);--draw:light-dark(#946300,#facc15);--loss:light-dark(#b42318,#f87171);--bad:light-dark(#fde2df,#4a1712);
--sh:0 1px 2px rgb(10 20 50/.06),0 4px 16px rgb(10 20 50/.05)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:72px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip;padding-bottom:env(safe-area-inset-bottom)}
h1,h2,h3,.num,.big{font-family:"Barlow Condensed",Barlow,system-ui,sans-serif;font-weight:700;line-height:1.05;margin:0}
h1{font-size:clamp(30px,4.4vw,46px);text-wrap:balance}h2{font-size:24px}h3{font-size:19px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--or);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:0 max(4vw,14px)}
/* header band */
.top{background:var(--band);color:var(--bandInk);padding-top:env(safe-area-inset-top)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-top:14px;padding-bottom:12px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;text-decoration:none;color:inherit}
.brand img{width:40px;height:40px;flex:none;border-radius:9px;background:#fff;display:block}
.brand b{font:700 24px/1 "Barlow Condensed",sans-serif;letter-spacing:.2px}
.brand small{display:block;font-size:13px;opacity:.8;font-weight:500}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.top select{background:rgb(255 255 255/.14);border:1px solid rgb(255 255 255/.3);color:#fff;border-radius:10px;padding:8px 30px 8px 12px;min-height:40px;font-size:16px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,#fff 50%),linear-gradient(135deg,#fff 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.top select option{color:#111}
.cchips{display:flex;gap:4px;background:rgb(0 0 0/.18);padding:3px;border-radius:12px}
.cchips button{border:0;background:none;color:#fff;padding:7px 12px;border-radius:9px;min-height:36px;font-weight:600;opacity:.85}
.cchips button.on{background:#fff;color:#0f2a66;opacity:1}
.status{font-size:13px;opacity:.85;display:flex;align-items:center;gap:6px;white-space:nowrap}
.status i{width:8px;height:8px;border-radius:50%;background:#7CF0A6;display:inline-block}
.status.busy i{background:#ffd166}.status.err i,.status.warn i{background:#ff7a7a}
.gear{border:0;background:rgb(255 255 255/.14);color:#fff;border-radius:10px;width:42px;height:42px;display:grid;place-items:center}
.gear svg{width:22px;height:22px}
nav.tabs{display:flex;gap:2px;overflow-x:auto}
nav.tabs a{color:#fff;text-decoration:none;padding:10px 14px 12px;font-weight:600;opacity:.78;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a.on{opacity:1;border-color:var(--or)}
.tabsrow{border-top:1px solid rgb(255 255 255/.15)}
.tabsrow .wrap{padding-top:0;padding-bottom:0}
.botnav{display:none}
.demo{background:var(--or);color:#fff;font-weight:600;font-size:14px}
.demo .wrap{display:flex;gap:10px;align-items:center;justify-content:space-between;padding-top:8px;padding-bottom:8px}
.demo button{background:#fff;color:#7a2a00;border:0;border-radius:8px;padding:6px 12px;font-weight:700;min-height:36px}
main{padding:22px 0 60px}
/* generic */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--sh)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sp{margin-left:auto}
.mut{color:var(--mut)}.small{font-size:14px}
.sect{margin:26px 0 12px;display:flex;flex-wrap:wrap;gap:10px;align-items:end;justify-content:space-between}
.btn{border:1px solid var(--line);background:var(--card);border-radius:11px;padding:9px 15px;min-height:44px;font-weight:600;display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.acc{background:var(--or);border-color:var(--or);color:#fff}
.btn.ghost{background:none}
.btn.danger{color:var(--loss)}
.btn.sm{min-height:36px;padding:6px 11px;font-size:14px}
.btn svg{width:18px;height:18px}
.seg{display:inline-flex;background:var(--chip);border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:8px 14px;border-radius:9px;font-weight:600;min-height:38px;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
label.f{display:grid;gap:4px;font-size:14px;color:var(--mut);font-weight:500}
input.t,select.t,textarea.t{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 11px;min-height:44px;font-size:16px;color:var(--ink);width:100%}
textarea.t{min-height:70px;resize:vertical}
.empty{text-align:center;padding:40px 18px}
.empty p{max-width:52ch;margin:10px auto 18px;color:var(--mut)}
/* KPI */
.hero{background:var(--band);color:#fff;border-radius:20px;padding:clamp(18px,3vw,30px);display:grid;gap:20px;position:relative;overflow:hidden}
.hero .sub{opacity:.85;margin-top:6px}
.hero svg.deco{position:absolute;right:-40px;top:-30px;width:300px;opacity:.12;pointer-events:none}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;position:relative}
.kpi{background:rgb(255 255 255/.1);border:1px solid rgb(255 255 255/.18);border-radius:14px;padding:12px 14px}
.kpi .l{font-size:13px;opacity:.85;font-weight:500}
.kpi .v{font:700 clamp(28px,3.4vw,36px)/1.05 "Barlow Condensed",sans-serif;margin-top:4px;white-space:nowrap}
.kpi .s{font-size:13px;opacity:.85;margin-top:2px}
.kpis.light .kpi{background:var(--card);border-color:var(--line);color:var(--ink)}
.kpis.light .kpi .l,.kpis.light .kpi .s{color:var(--mut);opacity:1}
.res{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:7px;font:700 15px/1 "Barlow Condensed",sans-serif;color:#fff;flex:none}
.res.V{background:var(--win)}.res.R{background:var(--draw)}.res.P{background:var(--loss)}.res.N{background:var(--mut)}
:root .res{color:light-dark(#fff,#0a0f1d)}
.form{display:flex;gap:4px}
/* charts */
.fig{position:relative;min-height:260px;touch-action:pan-y}
.fig>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.fig .grid{stroke:var(--line);stroke-width:1}
.fig .ax{fill:var(--mut);font-size:12px;font-family:Barlow,sans-serif}
.fig .ln{fill:none;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.fig .dot{stroke:var(--card);stroke-width:2}
.fig .xh{stroke:var(--mut);stroke-width:1;stroke-dasharray:3 3}
.s1{stroke:var(--blue);fill:var(--blue)}.s2{stroke:var(--or);fill:var(--or)}
.ln.s1,.ln.s2{fill:none}
.tip{position:absolute;display:none;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh);border-radius:10px;padding:8px 10px;font-size:13px;pointer-events:none;z-index:3;white-space:nowrap}
.tip span{font-weight:700;margin-left:6px}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.sw.s1{background:var(--blue)}.sw.s2{background:var(--or)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:14px;color:var(--mut);margin:6px 0 4px}
.chead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px;align-items:baseline}
/* rankings */
.rk{display:grid;grid-template-columns:34px minmax(0,1fr) minmax(60px,1.2fr) 52px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.rk:last-child{border:0}
.rk .n{font:700 18px "Barlow Condensed",sans-serif;color:var(--mut);text-align:right}
.rk .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk .nm small{display:block;font-weight:400;color:var(--mut);font-size:13px}
.rk .bar{height:10px;background:var(--chip);border-radius:5px;overflow:hidden}
.rk .bar i{display:block;height:100%;background:var(--blue);border-radius:0 5px 5px 0}
.rk.o .bar i{background:var(--or)}
.rk b{font:700 22px "Barlow Condensed",sans-serif;text-align:right}
/* match list */
.ml{display:grid;gap:8px}
.mi{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;text-decoration:none;color:inherit}
.mi:hover{border-color:var(--blue)}
.mi .d{font-size:14px;color:var(--mut);line-height:1.2}
.mi .o{font-weight:700;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mi .sc{font:700 28px/1 "Barlow Condensed",sans-serif;white-space:nowrap;text-align:right}
.mi .sc small{display:block;font:500 12px Barlow,sans-serif;color:var(--mut);margin-top:3px}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--chip);color:var(--mut);margin-right:4px;white-space:nowrap}
.tag.b{background:var(--blue);color:#fff}
/* tables */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tblw{border:1px solid var(--line);border-radius:14px;background:var(--card)}
table.tbl{border-collapse:separate;border-spacing:0;width:100%;font-size:15px}
.tbl th,.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl th{font-size:13px;color:var(--mut);font-weight:600;background:var(--card);position:sticky;top:0}
.tbl th button{border:0;background:none;padding:0;font:inherit;color:inherit;font-weight:600;white-space:nowrap}
.tbl th button.asc::after{content:" ▲";font-size:10px}.tbl th button.desc::after{content:" ▼";font-size:10px}
.tbl th button.asc,.tbl th button.desc{color:var(--ink)}
.tbl .n{text-align:right;font-variant-numeric:tabular-nums}
.tbl .stk{position:sticky;left:0;background:var(--card);z-index:1}
.tbl tr[data-go]{cursor:pointer}.tbl tr[data-go]:hover td{background:var(--chip)}
.tbl tfoot td{font-weight:700;border-top:2px solid var(--line);border-bottom:0}
.tbl .jn{font:700 17px "Barlow Condensed",sans-serif;color:var(--mut);text-align:right;width:36px}
/* quick entry */
.qt input.qi{width:46px;min-height:40px;text-align:center;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:16px;padding:4px;font-variant-numeric:tabular-nums}
.qt input.qi:focus{background:var(--card);border-color:var(--blue)}
.qt input.qi.bad,.qc input.qi.bad{background:var(--bad);border-color:var(--loss)}
.qt td{padding:5px 6px}.qt th{text-align:center}
.qt input[type=checkbox]{width:22px;height:22px;accent-color:var(--blue)}
.qt tr.off td{opacity:.55}
.qchk{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px;margin-top:10px}
.qchk .ok{color:var(--win)}.qchk .no{color:var(--loss);font-weight:600}
.qcards{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.qc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.qc header{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.qc header .num{font-size:26px;color:var(--blue);width:40px;text-align:center}
.qc header b{flex:1}
.qc .sg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 10px}
.stp{display:grid;grid-template-columns:minmax(0,1fr) 40px 46px 40px;align-items:center;gap:4px;font-size:14px}
.stp span{color:var(--mut);line-height:1.15}
.stp button{height:40px;border:1px solid var(--line);background:var(--chip);border-radius:9px;font-size:20px;font-weight:700;padding:0}
.stp input.qi{height:40px;width:46px;text-align:center;border:1px solid var(--line);border-radius:9px;background:var(--bg);font-size:17px;font-weight:700}
.tgl{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;cursor:pointer}
.tgl input{width:22px;height:22px;accent-color:var(--blue)}
/* match editor */
.mh{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.mh .w2{grid-column:span 2}
.scorebox{display:flex;align-items:center;gap:8px}
.scorebox input{font:700 30px/1 "Barlow Condensed",sans-serif;text-align:center;width:74px;min-height:54px}
.scorebox span{font:700 30px "Barlow Condensed",sans-serif}
.etabs{margin:18px 0 14px}
/* court & goal */
svg.court{width:100%;height:auto;display:block;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.c-floor{fill:var(--court)}
.c-area{fill:var(--area);fill-opacity:.55;stroke:var(--cl);stroke-width:.09}
.c-9{fill:none;stroke:var(--cl);stroke-width:.08;stroke-dasharray:.35 .3}
.c-ln{stroke:var(--cl);stroke-width:.1}
.c-out{fill:none;stroke:var(--cl);stroke-width:.12}
.c-goal{fill:var(--card);stroke:var(--ink);stroke-width:.12}
.c-zone{fill:none;stroke:var(--mut);stroke-width:.05;stroke-dasharray:.15 .2;opacity:.7}
.hm{fill:var(--or)}
.zl rect{fill:var(--card);fill-opacity:.88}
.zl text{font:700 .62px Barlow,sans-serif;fill:var(--ink);text-anchor:middle}
.zl text.z2{font-weight:500;font-size:.5px;fill:var(--mut)}
.sh{stroke-width:.09}
.sh-g{fill:var(--or);stroke:var(--card)}
.sh-z{fill:var(--card);stroke:var(--blue);stroke-width:.14}
.sh-m,.sh-b{stroke:var(--mut);stroke-width:.14;fill:none}
.c-pend{fill:none;stroke:var(--ink);stroke-width:.14;stroke-dasharray:.25 .15}
.interactive{cursor:crosshair}
svg.goal{width:100%;height:auto;display:block;user-select:none;-webkit-user-select:none}
.g-net{fill:var(--card)}
.g-cell{fill:var(--or);fill-opacity:0;stroke:var(--line);stroke-width:1.5}
.g-cell.sel{fill:var(--blue);fill-opacity:.35}
.goal.interactive .g-cell{cursor:pointer}
.goal.interactive .g-cell:hover{fill:var(--blue);fill-opacity:.12}
.g-post{fill:none;stroke:var(--loss);stroke-width:9;stroke-linejoin:round}
.g-t{font:700 22px "Barlow Condensed",sans-serif;fill:var(--ink);text-anchor:middle;pointer-events:none}
.g-t2{font:500 14px Barlow,sans-serif;fill:var(--mut);text-anchor:middle;pointer-events:none}
.g-out{fill:transparent}
.goal.interactive .g-out{cursor:pointer}
.det{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
.pchips{display:flex;flex-wrap:wrap;gap:6px}
.pchip{border:1px solid var(--line);background:var(--card);border-radius:10px;min-height:44px;min-width:52px;padding:4px 10px;display:grid;line-height:1.05;text-align:center}
.pchip b{font:700 20px "Barlow Condensed",sans-serif}
.pchip small{font-size:11px;color:var(--mut);max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pchip.on{background:var(--blue);border-color:var(--blue);color:#fff}.pchip.on small{color:#e4ecff}
.rbtns{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.rbtns button{min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:15px}
.rbtns .rg{background:var(--or);border-color:var(--or);color:#fff}
.hint{font-size:14px;color:var(--mut);min-height:21px}
.shl{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.shl div{display:flex;gap:8px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--line);font-size:14px}
.shl div:last-child{border:0}
.shl button{margin-left:auto;border:0;background:none;color:var(--mut);font-size:20px;width:36px;height:36px}
.lg{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--mut);align-items:center}
.lg svg{width:14px;height:14px;vertical-align:-2px;margin-right:4px}
/* players */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;text-decoration:none;color:inherit;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;align-items:center}
.pc:hover{border-color:var(--blue)}
.pc .num{font-size:44px;color:var(--blue);grid-row:span 2;min-width:52px;text-align:center}
.pc.gk .num{color:var(--or)}
.pc b{font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc .st{grid-column:1/-1;display:flex;gap:14px;font-size:14px;color:var(--mut);border-top:1px solid var(--line);padding-top:8px;margin-top:6px}
.pc .st strong{color:var(--ink);font:700 18px "Barlow Condensed",sans-serif;margin-right:3px}
.pc.off{opacity:.55}
.phead{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.phead .num{font-size:72px;color:var(--blue)}
/* dialog & toast */
.dlg{position:fixed;inset:0;background:rgb(5 10 25/.5);display:grid;place-items:center;z-index:50;padding:16px}
.dlg .card{max-width:440px;width:100%}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:60;box-shadow:var(--sh);max-width:calc(100vw - 30px)}
.pdfbox{position:fixed;left:-12000px;top:0;width:780px;background:#fff;color:#111;font:13px/1.4 Barlow,Arial,sans-serif;padding:0}
.pdfbox h1{font:700 30px "Barlow Condensed",Arial,sans-serif;margin:0 0 4px}
.pdfbox h2{font:700 19px "Barlow Condensed",Arial,sans-serif;margin:18px 0 6px}
.pdfbox table{border-collapse:collapse;width:100%;font-size:10.5px}
.pdfbox th,.pdfbox td{border-bottom:1px solid #ddd;padding:3px 3px;text-align:left;white-space:nowrap}
.pdfbox th{background:#eef2fb}
.pdfbox .n{text-align:right}
.pdfbox .kp{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pdfbox .kp div{border:1px solid #ccd;border-radius:6px;padding:6px 10px}
.pdfbox .kp b{display:block;font:700 20px "Barlow Condensed",Arial,sans-serif}
details.sel summary{cursor:pointer;font-weight:600;list-style:none;display:inline-flex}
details.sel summary::-webkit-details-marker{display:none}

<script>
{
/* ================= utilities ================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const num=v=>{const n=parseInt(String(v).replace(/\D/g,''),10);return isNaN(n)?0:Math.min(n,999)};
const clone=o=>JSON.parse(JSON.stringify(o));
const pct=(a,b)=>b?a/b*100:null;
const f1=v=>v==null||!isFinite(v)?'–':(Math.round(v*10)/10).toLocaleString('cs-CZ',{minimumFractionDigits:1,maximumFractionDigits:1});
const fN=v=>v==null||!isFinite(v)?'–':(Math.round(v*10)/10).toLocaleString('cs-CZ');
const fP=v=>v==null?'–':f1(v)+' %';
const fP0=v=>v==null?'–':Math.round(v)+' %';
const fD=d=>{if(!d)return'';const[y,m,x]=d.split('-');return `${+x}. ${+m}. ${y}`};
const fDs=d=>{if(!d)return'';const[,m,x]=d.split('-');return `${+x}.${+m}.`};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const plural=(n,a,b,c)=>n===1?a:(n>=2&&n<=4?b:c);
const sgn=v=>v>0?'+'+v:String(v);
const POS={B:'Brankář',K:'Křídlo',S:'Spojka',P:'Pivot'};
const FF=[['pg','7m – góly','7m G'],['pa','7m – střely','7m S'],['z6','6m – góly','6m G'],['s6','6m – střely','6m S'],['z9','9m – góly','9m G'],['s9','9m – střely','9m S'],['zk','Křídlo – góly','Kř G'],['sk','Křídlo – střely','Kř S'],['ru','RÚ – góly','RÚ G'],['sr','RÚ – střely','RÚ S'],['tf','Technické chyby','TCh'],['st','Zisky míče','Zis'],['bl','Bloky (zablokované střely soupeře)','Blk'],['yc','Žluté karty','ŽK'],['tm','2min vyloučení','2′'],['rc','Červené karty','ČK']];
const GF=[['v6','6m – zákroky','6m Z'],['h6','6m – střely','6m S'],['v9','9m – zákroky','9m Z'],['h9','9m – střely','9m S'],['vk','Křídlo – zákroky','Kř Z'],['hk','Křídlo – střely','Kř S'],['s7','7m – zákroky','7m Z'],['a7','7m – střely','7m S'],['g','Góly','G'],['yc','Žluté karty','ŽK'],['tm','2min vyloučení','2′'],['rc','Červené karty','ČK']];
const QG=k=>['s6','s9','sk','sr','g','sh','pg','pa','z6','z9','zk','ru','sv','ga','s7','a7','v6','h6','v9','h9','vk','hk'].includes(k)?'gs':k==='tf'?'gt':'go';
const GLEG='<div class="glg"><span class="gs">Střelba</span><span class="gt">Technické chyby</span><span class="go">Ostatní</span></div>';
const KEYS=['g','sh','pg','pa','z6','z9','zk','ru','s6','s9','sk','sr','v6','h6','v9','h9','vk','hk','as','tf','st','bl','yc','tm','rc','sv','ga','s7','a7'];
const RES={g:'Gól',z:'Chycená',m:'Mimo',b:'Blok'};
const GC=['vlevo nahoře','nahoře uprostřed','vpravo nahoře','vlevo uprostřed','střed','vpravo uprostřed','vlevo dole','dole uprostřed','vpravo dole'];
const ZN={LK:'Levé křídlo',L6:'6 m vlevo',S6:'6 m střed',P6:'6 m vpravo',L9:'9 m vlevo',S9:'9 m střed',P9:'9 m vpravo',PK:'Pravé křídlo','7m':'7m hody'};
const ZPOS={LK:[2.1,3.2],PK:[17.9,3.2],L6:[5.3,7.1],S6:[10,8.1],P6:[14.7,7.1],L9:[3.9,13.2],S9:[10,14.2],P9:[16.1,13.2]};
const LS_KEY='hazena-stats-v1';
const H2C='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
const JSPDF='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';

/* ================= state ================= */
const S={team:null,matches:{},mode:'loading',view:null,ed:null,readonly:false,
 ui:{oxm:{h:'g',s:'g'},tog:new Set(),season:null,comp:'all',excl:new Set(),sort:{},stTab:'pole',heat:{pl:'all',mt:'all',mode:'zones'},qmode:null,etab:null}};
let REAL={team:null,matches:{},scout:{}};
const emptyTeam=()=>({name:'',players:[],seasons:[]});
const normTeam=t=>{t=clone(t||{});t.players=Array.isArray(t.players)?t.players:[];t.seasons=Array.isArray(t.seasons)?t.seasons:[];t.name=t.name||'';return t};
function applyReal(){S.team=REAL.team||emptyTeam();S.matches=REAL.matches||{};S.scout=REAL.scout||{}}

/* ================= storage ================= */
const PQ={};
const Store={kind:null,db:null,dl:null,
 async init(){
  let c=window.claude;
  if(!c){await new Promise(r=>setTimeout(r,350));c=window.claude}
  let db=null;
  if(c&&typeof c.use==='function'){
   try{db=await c.use('db')}catch(e){db=null}
   try{this.dl=await c.use('downloads')}catch(e){this.dl=null}
  }
  if(db){this.kind='db';this.db=db;this.subscribe()}else{this.kind='local';this.loadLocal()}
 },
 subscribe(){
  let gT=false,gM=false,gS=false;
  const timer=setTimeout(()=>{if(!(gT&&gM&&gS))setStatus('Data zatím nejsou dostupná, zkouším znovu…','warn')},10000);
  const done=()=>{if(!(gT&&gM&&gS))return;clearTimeout(timer);
   if(S.mode==='loading'){S.mode='db';applyReal();boot()}else if(S.mode!=='demo'){applyReal();softRender()}
   if(!Object.values(PQ).some(x=>x.w))setStatus(S.readonly?'Jen pro čtení':'Synchronizováno','ok')};
  this.db.doc('app/team').onSnapshot(s=>{REAL.team=s.exists?normTeam(s.data()):emptyTeam();gT=true;done()},e=>{dbErr(e);REAL.team=REAL.team||emptyTeam();gT=true;done()});
  this.db.collection('scout').onSnapshot(q=>{const m={};q.docs.forEach(d=>{if(d.exists)m[d.id]=clone(d.data())});if(S.sc&&!S.sc.isNew&&PQ['scout/'+S.sc.d.id]?.w)m[S.sc.d.id]=clone(S.sc.d);REAL.scout=m;gS=true;done()},e=>{dbErr(e);gS=true;done()});
  this.db.collection('matches').onSnapshot(q=>{const m={};q.docs.forEach(d=>{if(d.exists)m[d.id]=clone(d.data())});
   // keep the match open in the editor in its local state
   if(S.ed&&!S.ed.isNew&&PQ['matches/'+S.ed.m.id]?.w)m[S.ed.m.id]=clone(S.ed.m);
   REAL.matches=m;gM=true;done()},e=>{dbErr(e);gM=true;done()});
 },
 loadLocal(){let d=null;try{d=JSON.parse(localStorage.getItem(LS_KEY))}catch(e){}
  REAL.team=d&&d.team?normTeam(d.team):emptyTeam();REAL.matches=(d&&d.matches)||{};REAL.scout=(d&&d.scout)||{};S.mode='local';applyReal();boot();
  setStatus('Uloženo v tomto zařízení','ok')},
 saveLocal(){clearTimeout(this._lt);this._lt=setTimeout(()=>{try{localStorage.setItem(LS_KEY,JSON.stringify(REAL));setStatus('Uloženo v tomto zařízení','ok')}catch(e){setStatus('Nelze uložit','err');toast('Úložiště prohlížeče není dostupné – data se neuloží.')}},250)},
 saveTeam(){if(S.mode==='demo')return;if(this.kind==='db')qwrite('app/team',clone(REAL.team));else this.saveLocal()},
 saveMatch(m){if(S.mode==='demo'){S.matches[m.id]=clone(m);return}REAL.matches[m.id]=clone(m);if(this.kind==='db')qwrite('matches/'+m.id,clone(m));else this.saveLocal()},
 saveScout(d){if(S.mode==='demo'){S.scout[d.id]=clone(d);return}REAL.scout[d.id]=clone(d);if(this.kind==='db')qwrite('scout/'+d.id,clone(d));else this.saveLocal()},
 delScout(id){if(S.mode==='demo'){delete S.scout[id];return}delete REAL.scout[id];if(this.kind==='db')qwrite('scout/'+id,null);else this.saveLocal()},
 delMatch(id){if(S.mode==='demo'){delete S.matches[id];return}delete REAL.matches[id];if(this.kind==='db')qwrite('matches/'+id,null);else this.saveLocal()}
};
function qwrite(path,data){if(S.readonly){toast('Data jsou jen pro čtení.');return}const p=PQ[path]||(PQ[path]={w:false});p.d=data;p.has=true;setStatus('Ukládám…','busy');if(!p.w)flushQ(path)}
async function flushQ(path){const p=PQ[path];p.w=true;
 while(p.has){const d=p.d;p.has=false;
  for(let tr=0;tr<2;tr++){try{const ref=Store.db.doc(path);if(d===null)await ref.delete();else await ref.set(d);break}
   catch(e){if(e&&e.code==='unavailable'&&tr===0){await new Promise(r=>setTimeout(r,600+Math.random()*600));continue}dbErr(e);break}}}
 p.w=false;if(!Object.values(PQ).some(x=>x.w))setStatus(S.readonly?'Jen pro čtení':'Uloženo','ok')}
function dbErr(e){const c=e&&e.code;
 if(c==='invalid_argument'){S.readonly=true;toast('Tato data můžete jen prohlížet – změny se neuloží.')}
 else if(c==='quota_exceeded')toast('Úložiště je plné: '+(e.message||''));
 else if(c==='revoked')toast('Přístup k datům byl odebrán.');
 else toast('Uložení se nepodařilo, zkuste to prosím znovu.');
 setStatus(S.readonly?'Jen pro čtení':'Chyba ukládání','err')}
function setStatus(t,k){const el=$('#status');if(!el)return;
 if(S.mode==='demo'){t='Ukázka';k='busy'}
 el.className='status '+(k||'');el.querySelector('span').textContent=t;el.title=t}

/* ================= helpers: data ================= */
const season=()=>S.team.seasons.find(s=>s.id===S.ui.season)||S.team.seasons[S.team.seasons.length-1];

function derive(t){t.goals=t.g+t.pg;t.shots=t.sh+t.pa;t.pct=pct(t.goals,t.shots);t.gpz=t.z?t.goals/t.z:null;t.pim=t.tm*2;
 t.svp=pct(t.sv,t.sv+t.ga);t.p7=pct(t.pg,t.pa);t.s7p=pct(t.s7,t.a7);t.gp6=pct(t.v6,t.h6);t.gp9=pct(t.v9,t.h9);t.gpk=pct(t.vk,t.hk);t.svz=t.z?t.sv/t.z:null;
 return t}
const FCAT=[['z6','s6'],['z9','s9'],['zk','sk'],['ru','sr']];
function effSt(st){if(!st)return st;const e=Object.assign({},st);
 if(FCAT.some(([,b])=>(+st[b]||0)>0)||(FCAT.some(([a])=>(+st[a]||0)>0)&&!(+st.g)&&!(+st.sh))){e.g=FCAT.reduce((a,[x])=>a+(+st[x]||0),0);e.sh=FCAT.reduce((a,[,y])=>a+(+st[y]||0),0)}
 if((+st.sv||0)>0||(+st.ga||0)>0)return e;const v=(+st.v6||0)+(+st.v9||0)+(+st.vk||0)+(+st.s7||0),h=(+st.h6||0)+(+st.h9||0)+(+st.hk||0)+(+st.a7||0);e.sv=v;e.ga=Math.max(0,h-v);return e}

/* ================= geometry ================= */
const distSeg=(x,y)=>{const cx=Math.min(11.5,Math.max(8.5,x));return Math.hypot(x-cx,Math.max(0,y))};
const arcPath=r=>`M${8.5-r},0 A${r},${r} 0 0 0 8.5,${r} L11.5,${r} A${r},${r} 0 0 0 ${11.5+r},0`;
function rayPt(th,D){const s=Math.sin(th*Math.PI/180),c=Math.cos(th*Math.PI/180);let lo=0,hi=40;for(let k=0;k<32;k++){const t=(lo+hi)/2;distSeg(10+t*s,t*c)<D?lo=t:hi=t}return[10+lo*s,lo*c]}
function rayEnd(th){const s=Math.sin(th*Math.PI/180),c=Math.cos(th*Math.PI/180);let lo=0,hi=40;const ins=t=>{const x=10+t*s,y=t*c;return x>=0&&x<=20&&y<=20};for(let k=0;k<32;k++){const t=(lo+hi)/2;ins(t)?lo=t:hi=t}return[10+lo*s,lo*c]}
const P=a=>a[0].toFixed(2)+','+a[1].toFixed(2);
let ZLINES=null;
function zoneLines(){if(ZLINES)return ZLINES;let d='';[-55,55].forEach(t=>d+=`M${P(rayPt(t,6))}L${P(rayEnd(t))}`);[-18,18].forEach(t=>d+=`M${P(rayPt(t,6))}L${P(rayEnd(t))}`);
 return ZLINES=d}
function goalCat(s){if(s.pu)return'ru';const z=zoneOf(s);return z==='LK'||z==='PK'?'zk':z&&z[1]==='9'?'z9':'z6'}
function zoneOf(s){if(s.is7)return'7m';if(s.x==null)return null;const th=Math.atan2(s.x-10,Math.max(s.y,.01))*180/Math.PI;
 if(th<-55)return'LK';if(th>55)return'PK';const r=distSeg(s.x,s.y)<=9?'6':'9';return(th<-18?'L':th>18?'P':'S')+r}

function shotMark(s,k=1){if(s.x==null)return'';const x=s.x.toFixed(2),y=s.y.toFixed(2);
 if(s.r==='g')return `<circle class="sh sh-g" cx="${x}" cy="${y}" r="${(.42*k).toFixed(2)}"/>`;
 if(s.r==='z')return `<circle class="sh sh-z" cx="${x}" cy="${y}" r="${(.36*k).toFixed(2)}"/>`;
 if(s.r==='b')return `<path class="sh sh-b" d="M${s.x-.34*k},${s.y+.3*k}L${s.x},${s.y-.34*k}L${s.x+.34*k},${s.y+.3*k}Z"/>`;
 return `<path class="sh sh-m" d="M${s.x-.3*k},${s.y-.3*k}L${s.x+.3*k},${s.y+.3*k}M${s.x+.3*k},${s.y-.3*k}L${s.x-.3*k},${s.y+.3*k}"/>`}
function heatDensity(shots){const G=.5,sig=1.35,pts=shots.filter(s=>s.x!=null&&!s.is7);if(!pts.length)return'';const v=[];let mx=0;
 for(let j=0;j<40;j++)for(let i=0;i<40;i++){const cx=i*G+G/2,cy=j*G+G/2;let a=0;for(const s of pts){const dx=s.x-cx,dy=s.y-cy;a+=Math.exp(-(dx*dx+dy*dy)/(2*sig*sig))}v.push(a);if(a>mx)mx=a}
 let h='';v.forEach((a,k)=>{const o=a/mx;if(o<.05)return;h+=`<rect class="hm" x="${(k%40)*G}" y="${Math.floor(k/40)*G}" width="${G+.01}" height="${G+.01}" fill-opacity="${(o*.85).toFixed(2)}"/>`});return h}
function zoneStats(shots){const Z={};Object.keys(ZN).forEach(k=>Z[k]={s:0,g:0});shots.forEach(s=>{const z=zoneOf(s);if(z&&Z[z]){Z[z].s++;if(s.r==='g')Z[z].g++}});return Z}
function heatZones(shots){const Z=zoneStats(shots),G=.5;let h='';const ps=Object.entries(Z).filter(([k,d])=>k!=='7m'&&d.s).map(([,d])=>d.g/d.s);const lo=Math.min(...ps),hi=Math.max(...ps),rg=hi-lo||1;
 for(let j=0;j<40;j++)for(let i=0;i<40;i++){if(distSeg(i*G+G/2,j*G+G/2)<6)continue;const z=zoneOf({x:i*G+G/2,y:j*G+G/2});const d=Z[z];if(!d||!d.s)continue;h+=`<rect class="hm" x="${i*G}" y="${j*G}" width="${G+.01}" height="${G+.01}" fill-opacity="${(ps.length>1?.12+.6*(d.g/d.s-lo)/rg:.4).toFixed(2)}"/>`}
 return h}
function zoneLabels(shots){const Z=zoneStats(shots);let h='<g class="zl">';Object.entries(ZPOS).forEach(([k,[x,y]])=>{const d=Z[k];
 h+=`<rect x="${x-1.55}" y="${y-.62}" width="3.1" height="1.38" rx=".3"/><text x="${x}" y="${y+.02}">${k} ${d.s?fP0(pct(d.g,d.s)):''}</text><text class="z2" x="${x}" y="${y+.55}">${d.g}/${d.s}</text>`});return h+'</g>'}
function court(o={}){const id='c'+(++CID);

 const sh=o.shots||[];const rs=sh.length>120?.6:sh.length>50?.78:1;h+=`<g style="opacity:${sh.length>120?.8:1}">`;sh.forEach(s=>h+=shotMark(s,rs));h+='</g>';
 if(o.marks){const k=o.marks.length>120?.6:o.marks.length>50?.78:1;o.marks.forEach(x=>h+=markOX(x,k))}

function goalSVG(o={}){const cw=100,ch=200/3;let h=`<svg class="goal${o.interactive?' interactive':''}" ${o.svgId?`id="${o.svgId}"`:''} viewBox="-30 -30 360 250" role="img" aria-label="Branka rozdělená na 9 polí">`;

const ROs=[];const AFTER=[];
function clearROs(){ROs.splice(0).forEach(r=>r.disconnect())}
function niceScale(max){if(!(max>0))max=1;const raw=max/4,mag=10**Math.floor(Math.log10(raw));const st=[1,2,2.5,5,10].find(s=>s*mag>=raw)*mag;return{max:Math.ceil(max/st-1e-9)*st,step:st}}
function roundTop(x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h));return `M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z`}
function figHTML(id,h=260){return `<div class="fig" id="${id}" style="min-height:${h}px"><svg aria-hidden="true"></svg><div class="tip"></div></div>`}
function chart(id,o){AFTER.push(()=>{const fig=document.getElementById(id);if(!fig)return;const svg=fig.querySelector('svg'),tip=fig.querySelector('.tip');let geo=null;
 const tf=o.tfmt||fN;
 const draw=()=>{const W=fig.clientWidth,H=fig.clientHeight;if(!W||!H)return;const nar=W<520,pl=nar?30:40,pr=8,pt=10,pb=26,n=o.labels.length;
  const all=o.series.flatMap(s=>s.values).filter(v=>v!=null);const sc=o.yMax?{max:o.yMax,step:o.yMax/4}:niceScale(Math.max(1,...all));
  const iw=W-pl-pr,ih=H-pt-pb,band=iw/Math.max(n,1),x=i=>pl+band*(i+.5),y=v=>pt+ih*(1-v/sc.max);let h='';
  for(let v=0;v<=sc.max+1e-9;v+=sc.step)h+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${pl-6}" y="${y(v)+4}" text-anchor="end">${o.fmt?o.fmt(v):fN(v)}</text>`;
  const every=Math.max(1,Math.ceil(n/Math.max(1,Math.floor(iw/(nar?38:56)))));
  o.labels.forEach((l,i)=>{if(i%every===0)h+=`<text class="ax" x="${x(i)}" y="${H-7}" text-anchor="middle">${esc(l)}</text>`});
  if(o.type==='bar'){const s=o.series[0],bw=Math.max(4,Math.min(26,band*.6));s.values.forEach((v,i)=>{if(v==null||v<=0)return;const yy=y(v);h+=`<path class="${s.cls}" style="stroke:none" d="${roundTop(x(i)-bw/2,yy,bw,pt+ih-yy,4)}"/>`})}
  else o.series.forEach(s=>{let d='',pen=false;s.values.forEach((v,i)=>{if(v==null){pen=false;return}d+=(pen?'L':'M')+x(i).toFixed(1)+','+y(v).toFixed(1);pen=true});h+=`<path class="ln ${s.cls}" d="${d}"/>`;
   if(n<=40)s.values.forEach((v,i)=>{if(v!=null)h+=`<circle class="dot ${s.cls}" cx="${x(i)}" cy="${y(v)}" r="${n>20?3:4.2}"/>`})});
  h+=`<line class="xh" x1="0" x2="0" y1="${pt}" y2="${pt+ih}" style="display:none"/>`;
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.innerHTML=h;geo={pl,band,n,x}};
 const hide=()=>{tip.style.display='none';const xh=svg.querySelector('.xh');if(xh)xh.style.display='none'};

  const xh=svg.querySelector('.xh');xh.setAttribute('x1',geo.x(i));xh.setAttribute('x2',geo.x(i));xh.style.display='';
  tip.innerHTML=`<b>${esc(o.tips?o.tips[i]:o.labels[i])}</b>`+o.series.map(s=>`<div><i class="sw ${s.cls}"></i>${esc(s.name)}<span>${s.values[i]==null?'–':tf(s.values[i])}</span></div>`).join('');
  tip.style.display='block';const tw=tip.offsetWidth;let left=geo.x(i)+12;if(left+tw>r.width)left=geo.x(i)-tw-12;tip.style.left=Math.max(0,left)+'px';tip.style.top='4px'};

  const cv=await window.html2canvas(box,{scale:2,backgroundColor:'#ffffff',logging:false});const{jsPDF}=window.jspdf;const pdf=new jsPDF({unit:'mm',format:'a4'});
  const m=12,cw=210-2*m,pxmm=cv.width/cw,pageH=Math.floor((297-2*m)*pxmm),sc=cv.width/box.offsetWidth,top0=box.getBoundingClientRect().top;
  const brk=$$('tr,h1,h2,.kp,.pbrk',box).map(e=>Math.round((e.getBoundingClientRect().top-top0)*sc)).sort((a,b)=>a-b);
  let y=0,first=true;while(y<cv.height-4){let end=Math.min(cv.height,y+pageH);if(end<cv.height){const c=brk.filter(b=>b>y+pageH*.4&&b<=end);if(c.length)end=c[c.length-1]}
   const sl=document.createElement('canvas');sl.width=cv.width;sl.height=end-y;const cx=sl.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,sl.width,sl.height);cx.drawImage(cv,0,y,cv.width,end-y,0,0,cv.width,end-y);
   if(!first)pdf.addPage();pdf.addImage(sl.toDataURL('image/jpeg',.92),'JPEG',m,m,cw,(end-y)/pxmm);first=false;y=end}

function qCard(m,p,F){const st=m.stats[p.id]||{};const on=played(st);
